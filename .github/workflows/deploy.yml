name: Deploy to production

on:
  push:
    branches: [development]

# Cancel an in-flight deploy if a newer push lands before it finishes, so we
# never run two deploys concurrently against the same instance.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15  # same as production
        env:
          POSTGRES_USER: templeuser
          POSTGRES_PASSWORD: templepass
          POSTGRES_DB: templedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U templeuser -d templedb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # pytest runs on SQLite and never touches Alembic, so a migration that
      # only fails on Postgres would otherwise first fail in the production
      # container's entrypoint - crash-looping the backend.
      - name: Apply all migrations to Postgres
        env:
          ENV: production
          DATABASE_URL: postgresql://templeuser:templepass@localhost:5432/templedb
          SECRET_KEY: ci-only-throwaway-secret-key-0123456789abcdef
          CORS_ORIGINS: https://svvdthorur.org
        run: alembic -c alembic.prod.ini upgrade head
      - run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  deploy:
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "ubuntu@${{ secrets.EC2_HOST }}" \
            "deploy triggered by GitHub Actions"
        # The command above is ignored server-side: this key's
        # authorized_keys entry forces deploy/aws/deploy.sh regardless of
        # what's requested, so a leaked key can only trigger a redeploy of
        # the current development branch, nothing else.
