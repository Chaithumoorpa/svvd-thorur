name: Deploy to production

on:
  push:
    branches: [development]

# Cancel an in-flight deploy if a newer push lands before it finishes, so we
# never run two deploys concurrently against the same instance.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  deploy:
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "ubuntu@${{ secrets.EC2_HOST }}" \
            "deploy triggered by GitHub Actions"
        # The command above is ignored server-side: this key's
        # authorized_keys entry forces deploy/aws/deploy.sh regardless of
        # what's requested, so a leaked key can only trigger a redeploy of
        # the current development branch, nothing else.
