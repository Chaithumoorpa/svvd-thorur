name: Dependency audit

# Known-vulnerability scan of the pinned backend and frontend dependencies.
# Deliberately NOT part of the deploy workflow: an advisory published today
# shouldn't block an unrelated urgent fix from shipping. A failing run here
# (GitHub emails the repo owner) means: upgrade the named package.
on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - backend/requirements*.txt
      - frontend/package.json
      - frontend/package-lock.json

# Least privilege: these jobs only check out code; none writes to GitHub.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
