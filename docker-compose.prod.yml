# Docker Compose - Production Environment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-templedb}
      POSTGRES_USER: ${POSTGRES_USER:-templeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Must be set in environment
    # Do NOT expose PostgreSQL port in production

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env.production
        required: false
    environment:
      ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-templeuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-templedb}
      SECRET_KEY: ${SECRET_KEY}  # Must be set in environment
      SQLALCHEMY_ECHO: "false"
      LOG_LEVEL: WARNING
      ENABLE_DOCS: "false"
      ENABLE_SECURITY_HEADERS: "true"
      ENABLE_RATE_LIMITING: "true"
      RATE_LIMIT_PER_MINUTE: "120"
      ALEMBIC_CONFIG: alembic.prod.ini
      # Number of reverse proxies in front of the backend that APPEND to
      # X-Forwarded-For. Keep 1 for Nginx -> Next.js -> backend: the Next.js
      # /api/v1 rewrite passes the header through without adding a hop. 2 here
      # puts every visitor in one shared rate-limit bucket (e.g. 10 blessing-photo
      # uploads per hour for the whole site); 0 lets clients spoof their IP.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://svvdthorur.org}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    # No volume mounts in production - use built image
    # ONE worker: the login/OTP/booking rate limits and the content cache live in
    # process memory, so each extra worker would multiply every limit (and serve
    # stale cache). One async worker with its thread pool is ample for this site;
    # scale out only after moving the limiters to a shared store (e.g. Redis).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --log-level warning
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api/v1
        - NEXT_PUBLIC_ENV=production
        - INTERNAL_API_BASE_URL=http://backend:8000/api/v1
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://svvdthorur.org}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
      - INTERNAL_API_BASE_URL=http://backend:8000/api/v1
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=production
      - NEXT_PUBLIC_ENABLE_DEBUG_BANNER=false
      - NEXT_PUBLIC_ENABLE_API_LOGGING=false
    # No volume mounts in production - use built image.
    # No command override here: the Dockerfile builds a standalone Next.js
    # output (next.config.mjs: output: 'standalone') whose runner stage has
    # no node_modules/next CLI at all - it only runs via the Dockerfile's own
    # CMD ["node", "server.js"]. `npm start` (-> `next start`) fails here.
    restart: always
