# Nginx reverse proxy for svvdthorur.org on the EC2 instance.
# Copy to /etc/nginx/conf.d/svvdthorur.conf, then run:
#   sudo certbot --nginx -d svvdthorur.org -d www.svvdthorur.org
# Certbot rewrites this file in place to add the SSL server block and the
# HTTP->HTTPS redirect, so start from HTTP-only here.

server {
    listen 80;
    listen [::]:80;
    server_name svvdthorur.org www.svvdthorur.org;

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (bypasses the Next.js rewrite; also reachable via /api/v1
    # through the frontend above — this block just lets direct /health checks work)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
