# Alembic Configuration - DEVELOPMENT
# This configuration is for development environments only

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# version path separator
version_path_separator = os

# Database URL (will be overridden by env.py from environment variable)
sqlalchemy.url = postgresql://templeuser:templepass@postgres:5432/templedb


[post_write_hooks]
# Post-write hooks for code formatting (optional)


# Logging configuration - VERBOSE for development
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = DEBUG
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
