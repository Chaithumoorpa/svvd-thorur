# Local stack: Postgres + backend. The frontend is not containerised - run it with
# `cd frontend && npm run dev` (it proxies /api/v1 to 127.0.0.1:8000); production
# serves it from Vercel and the backend from AWS Lambda (see DEPLOY_SERVERLESS.md).

services:
  postgres:
    image: postgres:15
    container_name: temple_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-templedb}
      TZ: ${TZ:-Asia/Kolkata}
      POSTGRES_USER: ${POSTGRES_USER:-templeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-templepass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-templeuser} -d ${POSTGRES_DB:-templedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temple_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-templeuser}:${POSTGRES_PASSWORD:-templepass}@postgres:5432/${POSTGRES_DB:-templedb}
      # No default on purpose: production refuses to start with a missing/weak key.
      SECRET_KEY: ${SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENV: production
      TZ: Asia/Kolkata
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
    ports:
      # Loopback only: put Nginx/Caddy in front. Publishing this port publicly
      # would let clients bypass the proxy and spoof X-Forwarded-For.
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
